<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - React</title>
</head>
<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
        function App() {
            return (
                <div style={{ fontFamily: 'Arial, sans-serif', textAlign: 'center', padding: '50px', background: '#e3f2fd', minHeight: '100vh' }}>
                    <h1 style={{ color: '#1565c0' }}>Hello World from React!</h1>
                    <p style={{ color: '#555' }}>Student: PIYUSH PAWAN KUMAR | Enrollment: 2024eb02275</p>
                    <p style={{ color: '#777' }}>Built with React 18 and served via Nginx</p>
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
